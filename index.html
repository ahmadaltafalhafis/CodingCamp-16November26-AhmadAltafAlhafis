<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>🧠 My Dashboard</h1>
    <div class="header-controls">
      <button class="btn-icon" id="theme-toggle" title="Toggle dark/light mode">🌙</button>
    </div>
  </header>

  <!-- MAIN GRID -->
  <main>

    <!-- GREETING -->
    <section class="card" id="greeting-section">
      <div class="greeting-inner">
        <div>
          <div id="greeting-text">Hello!</div>
          <div class="name-input-row">
            <input type="text" id="name-input" placeholder="Enter your name…" maxlength="30" />
            <button class="btn-primary" id="save-name">Save</button>
          </div>
        </div>
        <div id="datetime">
          <div id="current-time">00:00:00</div>
          <div id="current-date">Loading…</div>
        </div>
      </div>
    </section>

    <!-- FOCUS TIMER -->
    <section class="card">
      <h2>⏱️ Focus Timer</h2>

      <div class="timer-display">
        <div id="timer-time">25:00</div>
        <div id="timer-label">Ready</div>
      </div>

      <div class="timer-progress">
        <div id="timer-bar"></div>
      </div>

      <div class="timer-controls">
        <button class="btn-primary" id="timer-start">▶ Start</button>
        <button class="btn-warning" id="timer-stop">⏹ Stop</button>
        <button class="btn-icon"    id="timer-reset" title="Reset">🔄</button>
      </div>

      <div class="timer-duration-row">
        <label for="duration-input">Set duration:</label>
        <input type="number" id="duration-input" min="1" max="180" value="25" />
        <span>min</span>
        <button class="btn-primary" id="set-duration">Set</button>
      </div>
    </section>

    <!-- TO-DO LIST -->
    <section class="card">
      <h2>✅ To-Do List</h2>

      <div class="todo-controls">
        <input type="text" id="todo-input" placeholder="Add a new task…" maxlength="100" />
        <button class="btn-primary" id="add-task">Add</button>
      </div>

      <div class="todo-filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>

      <div class="sort-row">
        <label for="sort-select">Sort:</label>
        <select id="sort-select">
          <option value="none">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>

      <ul id="todo-list"></ul>
    </section>

    <!-- QUICK LINKS -->
    <section class="card">
      <h2>🔗 Quick Links</h2>

      <div class="links-add-row">
        <input type="text" id="link-name-input" placeholder="Name" maxlength="20" />
        <input type="text" id="link-url-input"  placeholder="URL (e.g. youtube.com)" />
        <button class="btn-primary" id="add-link">Add</button>
      </div>

      <div id="links-grid"></div>
    </section>

  </main>

  <!-- TOAST -->
  <div id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
